<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Console - Admin Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #000; color: white; }
        .admin-stat { background: linear-gradient(145deg, #0f172a, #020617); border: 1px solid #1e293b; }
    </style>
</head>
<body class="bg-black text-white">
    <div class="flex min-h-screen">
        <aside class="w-80 border-r border-slate-900 p-10 hidden md:flex flex-col gap-10">
            <h1 class="text-2xl font-black tracking-tighter text-indigo-500">NOVA <span class="text-white">CONSOLE</span></h1>
            <nav class="space-y-2">
                <p class="text-[10px] font-black text-slate-600 uppercase tracking-widest px-4 mb-4">Master Control</p>
                <div class="p-4 bg-indigo-600 rounded-2xl font-black text-sm cursor-pointer shadow-lg shadow-indigo-600/20">Dashboard Overview</div>
                <div class="p-4 text-slate-400 hover:text-white transition-all font-black text-sm cursor-pointer">Manage Binaries</div>
                <div class="p-4 text-slate-400 hover:text-white transition-all font-black text-sm cursor-pointer">Security Logs</div>
            </nav>
        </aside>

        <main class="flex-1 p-8 lg:p-16">
            <header class="flex justify-between items-end mb-16">
                <div>
                    <h2 class="text-4xl font-black mb-2">Developer Panel</h2>
                    <p class="text-slate-500 font-medium italic">Welcome back, Administrator</p>
                </div>
                <button class="px-8 py-4 bg-emerald-500 hover:bg-emerald-600 text-white rounded-2xl font-black uppercase text-[10px] tracking-widest shadow-xl shadow-emerald-500/20 transition-all">+ Add New APK</button>
            </header>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-12">
                <div class="admin-stat p-8 rounded-[2.5rem]">
                    <p class="text-slate-500 text-[10px] font-black uppercase tracking-widest mb-3">Active Downloads</p>
                    <h3 class="text-4xl font-black italic">842.5K</h3>
                </div>
                <div class="admin-stat p-8 rounded-[2.5rem]">
                    <p class="text-slate-500 text-[10px] font-black uppercase tracking-widest mb-3">System Health</p>
                    <h3 class="text-4xl font-black italic text-emerald-500">99.8%</h3>
                </div>
                <div class="admin-stat p-8 rounded-[2.5rem]">
                    <p class="text-slate-500 text-[10px] font-black uppercase tracking-widest mb-3">Pending Reviews</p>
                    <h3 class="text-4xl font-black italic text-amber-500">12</h3>
                </div>
            </div>

            <div class="bg-slate-900/30 border border-slate-900 rounded-[2.5rem] overflow-hidden">
                <div class="p-8 border-b border-slate-900 flex justify-between items-center">
                    <h4 class="font-black text-lg">App Inventory</h4>
                    <span class="text-[10px] font-black bg-slate-800 px-4 py-2 rounded-full text-slate-400 uppercase tracking-widest">Total: 254 Apps</span>
                </div>
                <div class="p-8 text-center text-slate-600 italic">
                    Binary inventory is synchronizing with Firebase...
                </div>
            </div>
        </main>
    </div>
</body>
</html>
