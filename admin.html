<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Console - Secure Access</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #020617; color: white; overflow-x: hidden; }
        .hidden { display: none; }
        .admin-stat { background: linear-gradient(145deg, #0f172a, #020617); border: 1px solid #1e293b; }
        .glass-card { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body>

    <div id="login-screen" class="min-h-screen flex items-center justify-center p-6 bg-[radial-gradient(circle_at_top,_var(--tw-gradient-stops))] from-indigo-900/20 via-slate-950 to-slate-950">
        <div class="w-full max-w-md glass-card p-10 rounded-[3rem] shadow-2xl">
            <div class="text-center mb-10">
                <div class="w-20 h-20 bg-indigo-600 rounded-[2rem] flex items-center justify-center mx-auto mb-6 shadow-2xl shadow-indigo-600/40">
                    <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                </div>
                <h1 class="text-3xl font-black tracking-tighter italic">NOVA <span class="text-indigo-500">CONSOLE</span></h1>
                <p class="text-slate-500 text-[10px] mt-3 uppercase tracking-[0.3em] font-black">Authorized Access Only</p>
            </div>
            
            <form id="admin-login-form" class="space-y-5">
                <div>
                    <input type="text" id="username" class="w-full bg-slate-800/50 border border-slate-700 rounded-2xl p-4 text-white focus:ring-2 focus:ring-indigo-500 outline-none transition-all" placeholder="Username" required>
                </div>
                <div>
                    <input type="password" id="password" class="w-full bg-slate-800/50 border border-slate-700 rounded-2xl p-4 text-white focus:ring-2 focus:ring-indigo-500 outline-none transition-all" placeholder="Password" required>
                </div>
                <button type="submit" class="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl font-black uppercase text-[10px] tracking-[0.2em] transition-all shadow-xl shadow-indigo-600/20 active:scale-95">Verify Identity</button>
                <p id="error-msg" class="text-red-500 text-[10px] text-center font-black uppercase hidden tracking-widest mt-4">Invalid Credentials! Access Blocked.</p>
            </form>
        </div>
    </div>

    <div id="admin-dashboard" class="flex min-h-screen hidden animate-in fade-in duration-700">
        <aside class="w-80 border-r border-slate-900 p-10 hidden md:flex flex-col gap-10 bg-black/40">
            <h1 class="text-2xl font-black tracking-tighter text-indigo-500 italic">NOVA CONSOLE</h1>
            <nav class="space-y-4">
                <div class="p-4 bg-indigo-600 rounded-2xl font-black text-sm shadow-lg">Overview</div>
                <div class="p-4 text-slate-400 hover:text-white font-black text-sm cursor-pointer transition-colors">Manage Apps</div>
                <div class="p-4 text-slate-400 hover:text-white font-black text-sm cursor-pointer transition-colors">Security Logs</div>
                <button onclick="location.reload()" class="w-full mt-20 p-4 border border-red-500/30 text-red-500 rounded-2xl font-black text-sm hover:bg-red-500 hover:text-white transition-all">Logout</button>
            </nav>
        </aside>

        <main class="flex-1 p-8 lg:p-16">
            <header class="flex flex-col md:flex-row justify-between items-start md:items-end gap-6 mb-16">
                <div>
                    <h2 class="text-5xl font-black mb-2 tracking-tighter">Owner Panel</h2>
                    <p class="text-slate-500 font-medium tracking-wide">Welcome, <span class="text-white">Md Nur Noby Islam</span></p>
                </div>
                <button class="px-10 py-5 bg-emerald-500 hover:bg-emerald-600 text-white rounded-2xl font-black uppercase text-[10px] tracking-widest shadow-xl shadow-emerald-500/20 transition-all active:scale-95">+ Upload Binary</button>
            </header>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                <div class="admin-stat p-8 rounded-[2.5rem]">
                    <p class="text-slate-500 text-[10px] font-black uppercase tracking-widest mb-3">Total Installs</p>
                    <h3 class="text-4xl font-black italic">1.2M+</h3>
                </div>
                <div class="admin-stat p-8 rounded-[2.5rem]">
                    <p class="text-slate-500 text-[10px] font-black uppercase tracking-widest mb-3">System Security</p>
                    <h3 class="text-4xl font-black text-emerald-500">Active</h3>
                </div>
                <div class="admin-stat p-8 rounded-[2.5rem]">
                    <p class="text-slate-500 text-[10px] font-black uppercase tracking-widest mb-3">Database</p>
                    <h3 class="text-4xl font-black text-indigo-500 italic">Live</h3>
                </div>
            </div>

            <div class="mt-12 p-10 bg-slate-900/20 border border-slate-900 rounded-[3rem] border-dashed text-center">
                <p class="text-slate-600 font-bold text-sm tracking-widest uppercase italic">Establishing connection to Firebase Cloud...</p>
            </div>
        </main>
    </div>

    <script>
        const loginForm = document.getElementById('admin-login-form');
        const loginScreen = document.getElementById('login-screen');
        const dashboard = document.getElementById('admin-dashboard');
        const errorMsg = document.getElementById('error-msg');

        // আপনার দেওয়া নতুন ইউজারনেম এবং পাসওয়ার্ড
        const ADMIN_USER = "nurnobycz";
        const ADMIN_PASS = "Nur@eity2023@@@@";

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            if (user === ADMIN_USER && pass === ADMIN_PASS) {
                loginScreen.classList.add('hidden');
                dashboard.classList.remove('hidden');
            } else {
                errorMsg.classList.remove('hidden');
                setTimeout(() => errorMsg.classList.add('hidden'), 4000);
            }
        });
    </script>
</body>
</html>
