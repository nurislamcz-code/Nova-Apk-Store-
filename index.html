<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Store - User Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #020617; color: white; }
        .glass-sidebar { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border-right: 1px solid rgba(255,255,255,0.1); }
        .app-card { background: #0f172a; border: 1px solid #1e293b; border-radius: 2rem; transition: all 0.3s ease; }
        .app-card:hover { transform: translateY(-5px); border-color: #6366f1; box-shadow: 0 20px 25px -5px rgba(99, 102, 241, 0.2); }
    </style>
</head>
<body>
    <div class="flex min-h-screen">
        <aside class="w-72 glass-sidebar hidden lg:flex flex-col p-8 sticky top-0 h-screen">
            <div class="flex items-center gap-3 mb-12">
                <div class="bg-indigo-600 p-3 rounded-2xl shadow-lg shadow-indigo-600/30">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
                </div>
                <h1 class="text-xl font-black tracking-tight">NOVA STORE</h1>
            </div>
            <nav class="space-y-4 flex-1">
                <a href="#" class="flex items-center gap-4 p-4 bg-indigo-600/10 text-indigo-400 rounded-2xl font-bold">Home</a>
                <a href="#" class="flex items-center gap-4 p-4 text-slate-400 hover:bg-slate-800 rounded-2xl font-bold">Library</a>
                <a href="#" class="flex items-center gap-4 p-4 text-slate-400 hover:bg-slate-800 rounded-2xl font-bold">Security</a>
            </nav>
            <div class="p-6 bg-slate-900/50 rounded-3xl border border-slate-800">
                <p class="text-[10px] text-slate-500 font-bold uppercase tracking-widest mb-1">Owner</p>
                <p class="text-sm font-black">Md Nur Noby Islam</p>
            </div>
        </aside>

        <main class="flex-1 p-6 lg:p-12 overflow-y-auto">
            <header class="flex justify-between items-center mb-12">
                <h2 class="text-3xl font-black">Premium <span class="text-indigo-500 italic">APKs</span></h2>
                <div class="w-10 h-10 bg-slate-800 rounded-full flex items-center justify-center border border-slate-700">
                    <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                </div>
            </header>

            <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-8">
                <div class="app-card p-6">
                    <div class="aspect-square bg-slate-800 rounded-[1.5rem] mb-6 flex items-center justify-center">
                        <svg class="w-12 h-12 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    </div>
                    <h3 class="font-bold text-lg mb-1">Nova Messenger Pro</h3>
                    <p class="text-xs text-slate-500 mb-6 font-semibold">Social • 45.2 MB</p>
                    <button class="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl font-black text-[10px] uppercase tracking-widest transition-all">Install Now</button>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
